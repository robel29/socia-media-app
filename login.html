<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Robel Desalegn</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body class="login-body">

  <!-- Background blobs -->
  <div class="login-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="login-wrapper">

    <!-- Card -->
    <div class="login-card">

      <!-- Logo / Brand -->
      <a href="index.html" class="login-brand">RD</a>
      <h1 class="login-title">Welcome Back</h1>
      <p class="login-subtitle">Sign in to your account</p>

      <!-- Toggle tabs -->
      <div class="login-tabs">
        <button class="login-tab active" data-method="email" id="tab-email">
          ✉️ Email
        </button>
        <button class="login-tab" data-method="phone" id="tab-phone">
          📞 Phone
        </button>
      </div>

      <!-- ── EMAIL FORM ── -->
      <form class="login-form active" id="form-email" novalidate>
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="login-email"
              name="email"
              placeholder="robeldesalegn172@gmail.com"
              autocomplete="email"
              required
            />
          </div>
          <span class="form-error" id="email-err"></span>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-pw" id="toggle-pw-email" aria-label="Show/hide password">👁️</button>
          </div>
          <span class="form-error" id="password-err"></span>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full login-btn" id="email-submit-btn">
          <span class="btn-label">Sign In</span>
          <span class="btn-loader hidden">Signing in...</span>
        </button>

        <div class="login-success hidden" id="email-success">
          ✅ Login successful! Redirecting...
        </div>
      </form>

      <!-- ── PHONE FORM ── -->
      <form class="login-form" id="form-phone" novalidate>
        <div class="form-group">
          <label for="login-phone">Phone Number</label>
          <div class="input-wrap">
            <span class="input-icon">📞</span>
            <input
              type="tel"
              id="login-phone"
              name="phone"
              placeholder="+251 965587039"
              autocomplete="tel"
              required
            />
          </div>
          <span class="form-error" id="phone-err"></span>
        </div>

        <div class="form-group">
          <label for="login-phone-password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="login-phone-password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-pw" id="toggle-pw-phone" aria-label="Show/hide password">👁️</button>
          </div>
          <span class="form-error" id="phone-password-err"></span>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-phone" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full login-btn" id="phone-submit-btn">
          <span class="btn-label">Sign In</span>
          <span class="btn-loader hidden">Signing in...</span>
        </button>

        <div class="login-success hidden" id="phone-success">
          ✅ Login successful! Redirecting...
        </div>
      </form>

      <!-- Divider -->
      <div class="login-divider"><span>or continue with</span></div>

      <!-- Social login -->
      <div class="social-login">
        <button class="social-login-btn" aria-label="Continue with Google">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="social-login-btn" aria-label="Continue with GitHub">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </button>
      </div>

      <!-- Sign up link -->
      <p class="login-back" style="margin-bottom:0.5rem;">
        Don't have an account?
        <a href="signup.html" class="forgot-link" style="margin-left:4px;">Sign Up</a>
      </p>

      <!-- Back link -->
      <p class="login-back">
        <a href="index.html" class="back-home-link">← Back to Portfolio</a>
      </p>

    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
