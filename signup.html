<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Robel Desalegn</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body class="login-body">

  <!-- Background blobs -->
  <div class="login-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="login-wrapper signup-wrapper">
    <div class="login-card">

      <!-- Brand -->
      <a href="index.html" class="login-brand">RD</a>
      <h1 class="login-title">Create Account</h1>
      <p class="login-subtitle">Join and get started today</p>

      <!-- Progress steps -->
      <div class="signup-steps">
        <div class="step active" id="step-dot-1">
          <span class="step-num">1</span>
          <span class="step-label">Personal</span>
        </div>
        <div class="step-line"></div>
        <div class="step" id="step-dot-2">
          <span class="step-num">2</span>
          <span class="step-label">Account</span>
        </div>
        <div class="step-line"></div>
        <div class="step" id="step-dot-3">
          <span class="step-num">3</span>
          <span class="step-label">Done</span>
        </div>
      </div>

      <form id="signup-form" novalidate>

        <!-- ── STEP 1: Personal Info ── -->
        <div class="signup-step active" id="step-1">
          <div class="form-group">
            <label for="su-firstname">First Name</label>
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input type="text" id="su-firstname" name="firstname"
                placeholder="Robel" autocomplete="given-name" required />
            </div>
            <span class="form-error" id="su-firstname-err"></span>
          </div>

          <div class="form-group">
            <label for="su-lastname">Last Name</label>
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input type="text" id="su-lastname" name="lastname"
                placeholder="Desalegn" autocomplete="family-name" required />
            </div>
            <span class="form-error" id="su-lastname-err"></span>
          </div>

          <div class="form-group">
            <label for="su-phone">Phone Number</label>
            <div class="input-wrap">
              <span class="input-icon">📞</span>
              <input type="tel" id="su-phone" name="phone"
                placeholder="+251 965587039" autocomplete="tel" required />
            </div>
            <span class="form-error" id="su-phone-err"></span>
          </div>

          <button type="button" class="btn btn-primary btn-full" id="next-btn-1">
            Next →
          </button>
        </div>

        <!-- ── STEP 2: Account Info ── -->
        <div class="signup-step" id="step-2">
          <div class="form-group">
            <label for="su-email">Email Address</label>
            <div class="input-wrap">
              <span class="input-icon">✉️</span>
              <input type="email" id="su-email" name="email"
                placeholder="robeldesalegn172@gmail.com" autocomplete="email" required />
            </div>
            <span class="form-error" id="su-email-err"></span>
          </div>

          <div class="form-group">
            <label for="su-password">Password</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input type="password" id="su-password" name="password"
                placeholder="At least 8 characters" autocomplete="new-password" required />
              <button type="button" class="toggle-pw" id="toggle-pw-su" aria-label="Show/hide password">👁️</button>
            </div>
            <div class="password-strength" id="pw-strength">
              <div class="strength-bar">
                <div class="strength-fill" id="strength-fill"></div>
              </div>
              <span class="strength-label" id="strength-label"></span>
            </div>
            <span class="form-error" id="su-password-err"></span>
          </div>

          <div class="form-group">
            <label for="su-confirm">Confirm Password</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input type="password" id="su-confirm" name="confirm"
                placeholder="Repeat your password" autocomplete="new-password" required />
              <button type="button" class="toggle-pw" id="toggle-pw-confirm" aria-label="Show/hide password">👁️</button>
            </div>
            <span class="form-error" id="su-confirm-err"></span>
          </div>

          <div class="form-group">
            <label class="terms-label">
              <input type="checkbox" id="su-terms" required />
              <span>I agree to the <a href="#" class="forgot-link">Terms &amp; Conditions</a></span>
            </label>
            <span class="form-error" id="su-terms-err"></span>
          </div>

          <div class="step-buttons">
            <button type="button" class="btn btn-outline" id="back-btn-2">← Back</button>
            <button type="submit" class="btn btn-primary" id="signup-submit-btn">
              <span class="btn-label">Create Account</span>
              <span class="btn-loader hidden">Creating...</span>
            </button>
          </div>
        </div>

        <!-- ── STEP 3: Success ── -->
        <div class="signup-step" id="step-3">
          <div class="signup-success-screen">
            <div class="success-icon">🎉</div>
            <h2>Account Created!</h2>
            <p>Welcome aboard, <strong id="success-name">Robel</strong>! Your account has been successfully created.</p>
            <a href="login.html" class="btn btn-primary" style="margin-top:1.5rem;">Go to Login →</a>
          </div>
        </div>

      </form>

      <!-- Divider -->
      <div class="login-divider" id="social-divider"><span>or sign up with</span></div>

      <!-- Social signup -->
      <div class="social-login" id="social-btns">
        <button class="social-login-btn" aria-label="Continue with Google">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google
        </button>
        <button class="social-login-btn" aria-label="Continue with GitHub">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </button>
      </div>

      <!-- Already have account -->
      <p class="login-back" id="login-link-wrap">
        Already have an account?
        <a href="login.html" class="forgot-link" style="margin-left:4px;">Sign In</a>
      </p>

    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
